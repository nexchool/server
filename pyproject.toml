[tool.pytest.ini_options]
# Some suites live beside the module they cover rather than under tests/.
# Both are named here so a suite cannot rot unnoticed: student_leaves sat
# broken for a while because `pytest tests/` never collected it.
testpaths = ["tests", "modules"]

[tool.coverage.run]
branch = true
include = [
    "modules/audit/models.py",
    "modules/school_setup/models.py",
    "modules/school_setup/template_models.py",
    "modules/school_setup/bulk_generator_service.py",
    "modules/school_setup/retention_tasks.py",
    "scripts/seed_subject_templates.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "coverage_html"
