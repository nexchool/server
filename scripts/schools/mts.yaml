# =============================================================================
# Mother Teresa School (MTS) — onboarding config
# Single unit · GSEB Gujarati medium · Nursery → Std 10 · sections A & B
# Run:  docker compose -f docker-compose.local.yml --env-file env/.env.local \
#         exec api python scripts/seed_school.py scripts/schools/mts.yaml --dry-run
#       (drop --dry-run to apply)
#
# Subjects and offerings for Std 1-10 are DERIVED from the programme's
# `template_board_code` (subject_template_groups) and must NOT be declared
# here -- the seed script rejects any config that carries a `subjects:` or
# `offerings:` block.
#
# PRE-PRIMARY (Nursery/LKG/UKG) via extra_subjects
#   GSEB publishes no syllabus below Std 1 -- there is no board template to
#   derive from, so MTS's own pre-primary curriculum is expressed below as
#   extra_subjects. GUJ/MATH/ENG/PE reuse the exact codes+names the
#   gseb_gujarati template already uses at Std 1+ (same subject, extended to
#   more grades, not a new one); ART/ACT are school-defined co-curricular
#   subjects the template has no code for at all.
# =============================================================================

tenant:
  subdomain: mts

academic_year:
  name: "2026-2027"
  start: 2026-06-01
  end: 2027-03-31
  active: true

units:
  - { code: "MTS", name: "Mother Teresa School" }

programmes:
  - { code: "GSEB-GUJ", name: "GSEB Gujarati", board: "GSEB", medium: "Gujarati", template_board_code: "gseb_gujarati" }

grades:
  - { name: "Nursery", sequence: 1 }
  - { name: "LKG",     sequence: 2 }
  - { name: "UKG",     sequence: 3 }
  - { name: "1",       sequence: 4 }
  - { name: "2",       sequence: 5 }
  - { name: "3",       sequence: 6 }
  - { name: "4",       sequence: 7 }
  - { name: "5",       sequence: 8 }
  - { name: "6",       sequence: 9 }
  - { name: "7",       sequence: 10 }
  - { name: "8",       sequence: 11 }
  - { name: "9",       sequence: 12 }
  - { name: "10",      sequence: 13 }

# Pre-primary curriculum. weekly periods carried over unchanged from what MTS
# already taught; codes/names remapped onto the catalogue (01->GUJ,
# 12->MATH, 16->ENG) so GUJ/MATH/ENG extend the same template subject rather
# than creating a second row for it (same code + same name = extension, not
# a redefinition). ART/ACT keep MTS's own names -- the template has no such
# codes for this board at any grade.
extra_subjects:
  - { code: "GUJ",  name: "Gujarati",               programme: "GSEB-GUJ", grades: ["Nursery", "LKG", "UKG"], weekly: 6, type: mandatory }
  - { code: "MATH", name: "Mathematics",             programme: "GSEB-GUJ", grades: ["Nursery", "LKG"],        weekly: 5, type: mandatory }
  - { code: "MATH", name: "Mathematics",             programme: "GSEB-GUJ", grades: ["UKG"],                   weekly: 6, type: mandatory }
  - { code: "ENG",  name: "English",                 programme: "GSEB-GUJ", grades: ["Nursery"],               weekly: 3, type: mandatory }
  - { code: "ENG",  name: "English",                 programme: "GSEB-GUJ", grades: ["LKG", "UKG"],            weekly: 4, type: mandatory }
  - { code: "ACT",  name: "Activity & Readiness",    programme: "GSEB-GUJ", grades: ["Nursery", "LKG"],        weekly: 5, type: mandatory, role: co_curricular }
  - { code: "ACT",  name: "Activity & Readiness",    programme: "GSEB-GUJ", grades: ["UKG"],                   weekly: 4, type: mandatory, role: co_curricular }
  - { code: "ART",  name: "Drawing & Art",           programme: "GSEB-GUJ", grades: ["Nursery", "LKG", "UKG"],  weekly: 3, type: mandatory, role: co_curricular }
  - { code: "PE",   name: "Physical Education",      programme: "GSEB-GUJ", grades: ["Nursery", "LKG", "UKG"], weekly: 3, type: mandatory }

# One class per grade, sections A and B.
classes:
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "Nursery", sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "LKG",     sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "UKG",     sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "1",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "2",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "3",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "4",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "5",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "6",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "7",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "8",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "9",       sections: [A, B] }
  - { unit: "MTS", programme: "GSEB-GUJ", grade: "10",      sections: [A, B] }
