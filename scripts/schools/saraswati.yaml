# =============================================================================
# Saraswati Vidyalaya — pilot onboarding config (limited classes)
# Single unit · GSEB Gujarati medium · Std 8–10 · sections A & B only
# Use to test the in-app upload (Onboarding screen) on a fresh tenant.
#
# Subjects and offerings are DERIVED from each programme's `template_board_code`
# (subject_template_groups) and must NOT be declared here -- the seed script
# rejects any config that carries a `subjects:` or `offerings:` block.
# =============================================================================

tenant:
  subdomain: saraswati

academic_year:
  name: "2026-2027"
  start: 2026-06-01
  end: 2027-03-31
  active: true

units:
  - { code: "SVV", name: "Saraswati Vidyalaya" }

programmes:
  - { code: "GSEB-GUJ", name: "GSEB Gujarati", board: "GSEB", medium: "Gujarati", template_board_code: "gseb_gujarati" }

grades:
  - { name: "8",  sequence: 8 }
  - { name: "9",  sequence: 9 }
  - { name: "10", sequence: 10 }

classes:
  - { unit: "SVV", programme: "GSEB-GUJ", grade: "8",  sections: [A, B] }
  - { unit: "SVV", programme: "GSEB-GUJ", grade: "9",  sections: [A, B] }
  - { unit: "SVV", programme: "GSEB-GUJ", grade: "10", sections: [A, B] }
