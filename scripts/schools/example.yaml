# Per-school onboarding config. Copy to <subdomain>.yaml and edit.
# Natural keys only (no UUIDs); the seed script resolves them at runtime.
# The tenant must already exist (created via platform onboarding).
#
# In-app Onboarding upload: this applies to the school you are operating in —
# `tenant.subdomain` is only a label (a mismatch is shown in the preview).
# CLI (scripts/seed_school.py): `tenant.subdomain` selects the target tenant.
#
# Subjects and offerings are DERIVED from each programme's `template_board_code`
# (subject_template_groups) and must NOT be declared here -- the seed script
# rejects any config that carries a `subjects:` or `offerings:` block. Valid
# board codes: gseb_gujarati, gseb_english, cbse.
tenant:
  subdomain: your-school-subdomain   # CLI target; ignored by the in-app upload

academic_year:
  name: "2026-2027"
  start: 2026-06-01
  end: 2027-03-31
  active: true

units:
  - { code: MN, name: "Main Campus" }

programmes:
  - { code: GSEB-GUJ, name: "GSEB Gujarati", board: GSEB, medium: Gujarati, template_board_code: gseb_gujarati }
  - { code: CBSE-ENG, name: "CBSE English", board: CBSE, medium: English, template_board_code: cbse }

grades:
  - { name: "1", sequence: 1 }
  - { name: "2", sequence: 2 }

# Classes -> bulk_generate_classes cells. Grade 11-12 streams via section
# prefix: "Sci-A", "Com-B", "Arts-A", "Voc-A".
classes:
  - { unit: MN, programme: GSEB-GUJ, grade: "1", sections: [A, B] }
  - { unit: MN, programme: GSEB-GUJ, grade: "2", sections: [A] }
  - { unit: MN, programme: CBSE-ENG, grade: "1", sections: [A] }
  - { unit: MN, programme: CBSE-ENG, grade: "2", sections: [A] }
